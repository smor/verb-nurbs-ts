<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NURBS inspector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE an exact instrument, quiet, for someone who wants to see how a shape is made
   IDEA a drafting light table: the object on the table, its anatomy in layers you lift on and off
   PICTURE the object in 3D with its control nets, knots, trims, seams and defects drawn on it
   COLOUR white table fading to pale grey, ink black, teal #1f6f6a leads, orange for control structure, red for faults
   TYPE Instrument Sans + Inter
   LAYOUT laptop: stage left, 340px panel right; phone: stage on top (55svh), panel below */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0e1312);--stage:light-dark(#eef1f3,#131719);--ink:light-dark(#121615,#e8efed);--soft:light-dark(#5b6664,#9aa8a5);--line:light-dark(#dde4e2,#26302e);--teal:light-dark(#1f6f6a,#5cc2b8);--tealbg:light-dark(#e3f0ee,#173230);--bad:light-dark(#c2410c,#ff8a50)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
.app{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:auto minmax(0,1fr);height:100%}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:14px max(2vw,16px);border-bottom:1px solid var(--line)}
h1{font:600 22px/1.05 "Instrument Sans",Inter,sans-serif;letter-spacing:-.02em;margin:0}
h1 small{display:block;font:400 13px/1.4 Inter,sans-serif;color:var(--soft);letter-spacing:0;margin-top:3px}
#groups{display:flex;gap:4px;margin-left:auto;background:var(--stage);padding:4px;border-radius:10px}
#groups button{font:500 14px Inter,sans-serif;color:var(--ink);background:none;border:0;border-radius:7px;padding:0 14px;min-height:38px;cursor:pointer}
#groups button[aria-pressed=true]{background:var(--bg);color:var(--teal);box-shadow:0 1px 2px #0002}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.stage{position:relative;background:radial-gradient(120% 90% at 50% 35%,var(--bg),var(--stage));overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stage.drag::after{content:"Drop to inspect";position:absolute;inset:12px;border:2px dashed var(--teal);border-radius:14px;display:grid;place-items:center;font:600 18px "Instrument Sans",sans-serif;color:var(--teal);background:color-mix(in srgb,var(--bg) 70%,transparent)}
#status{position:absolute;left:16px;bottom:14px;font:500 13px Inter,sans-serif;padding:6px 10px 6px 26px;border-radius:999px;background:var(--bg);border:1px solid var(--line);max-width:calc(100% - 32px)}
#status::before{content:"";position:absolute;left:10px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:var(--teal)}
#status[data-state=bad]{color:var(--bad)}#status[data-state=bad]::before{background:var(--bad)}
#status[data-state=busy]::before{background:var(--soft);animation:pulse .9s infinite alternate}
@keyframes pulse{to{opacity:.2}}
@media(prefers-reduced-motion:reduce){#status[data-state=busy]::before{animation:none}}
#recenter{position:absolute;right:14px;bottom:12px}
#legend{position:absolute;right:14px;top:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;display:none;width:200px}
#legend .bar{height:10px;border-radius:3px;margin:4px 0 2px}
#legend .ends{display:flex;justify-content:space-between;color:var(--soft);font-variant-numeric:tabular-nums}
aside{border-left:1px solid var(--line);overflow-y:auto;padding:18px 20px 24px;display:flex;flex-direction:column;gap:18px}
h2{font:600 13px Inter,sans-serif;text-transform:uppercase;letter-spacing:.06em;color:var(--soft);margin:0 0 6px}
#note{margin:0;color:var(--soft);font-size:14px}
select{font:500 14px Inter,sans-serif;width:100%;min-height:40px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#layers{display:flex;flex-direction:column;gap:2px}
#layers label{display:flex;align-items:center;gap:10px;min-height:32px;cursor:pointer;font-size:14px}
#layers input{width:18px;height:18px;accent-color:var(--teal);margin:0}
.sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid #0002}
.sw.dash{background-image:repeating-linear-gradient(90deg,currentColor 0 3px,transparent 3px 6px)!important;background-color:transparent!important}
.sw.dot{border-radius:50%}
dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;margin:0;font-size:13px}
dt{color:var(--soft)}
dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.card{padding:14px;border-radius:10px;background:var(--tealbg)}
#picked{display:none}
#picked h3{font:600 15px "Instrument Sans",sans-serif;margin:0 0 2px}
#picked p{margin:0 0 8px;color:var(--soft);font-size:13px}
.btn{font:500 14px Inter,sans-serif;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--teal)}
.foot{font-size:13px;color:var(--soft);margin:0}
input[type=file]{display:none}
@media(max-width:760px){.app{grid-template-columns:1fr;grid-template-rows:auto 55svh auto;height:auto}aside{border-left:0;border-top:1px solid var(--line)}#groups{margin-left:0;overflow-x:auto;max-width:100%}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>NURBS inspector<small>NURBS as NURBS, B-reps as B-reps, meshes as meshes</small></h1>
    <nav id="groups" aria-label="Kind of object"></nav>
  </header>
  <main class="stage" id="stage">
    <canvas id="view" aria-label="3D view of the object"></canvas>
    <div id="legend" aria-live="polite"><div id="legendName"></div><div class="bar" id="legendBar"></div><div class="ends"><span id="legendMin"></span><span id="legendMax"></span></div></div>
    <div id="status" role="status" data-state="busy">Loading…</div>
    <button class="btn" id="recenter">Re-frame</button>
  </main>
  <aside>
    <div>
      <label for="example"><h2>Object</h2></label>
      <select id="example"></select>
      <p id="note" style="margin-top:8px"></p>
    </div>
    <div>
      <h2>Layers</h2>
      <div id="layers"></div>
    </div>
    <div>
      <label for="shading"><h2>Shading</h2></label>
      <select id="shading">
        <option value="studio">Studio</option>
        <option value="zebra">Zebra stripes (reflection lines)</option>
        <option value="isophotes">Isophotes</option>
      </select>
      <div id="stripesRow" style="display:none;margin-top:8px"><label for="stripes" class="foot">Stripes</label> <input type="range" id="stripes" min="4" max="40" step="1" value="12" aria-label="Number of stripes">
        <select id="across" aria-label="Stripe direction" style="margin-top:6px"><option value="vertical">Vertical stripes</option><option value="horizontal">Horizontal stripes</option></select></div>
    </div>
    <div id="colourRow">
      <label for="colour"><h2>Colour</h2></label>
      <select id="colour"></select>
    </div>
    <div class="card" id="picked" aria-live="polite"><h3 id="pickedName"></h3><p id="pickedType"></p><dl id="pickedFacts"></dl></div>
    <div>
      <h2 id="factsTitle">Facts</h2>
      <dl id="facts"></dl>
    </div>
    <div id="stepRow" style="display:none">
      <button class="btn" id="step">Download STEP</button>
      <p class="foot" style="margin-top:8px">The solid as a STEP file (exact NURBS faces and edges) for any CAD system.</p>
    </div>
    <div>
      <button class="btn" id="open">Open a file…</button>
      <input type="file" id="file" accept=".stl,.obj,.json">
      <p class="foot" style="margin-top:8px">Or drop one on the view: an STL or OBJ mesh, or a NURBS curve or surface as verb JSON. Files stay in your browser.</p>
    </div>
  </aside>
</div>
<!--BUNDLE-->
</body>
</html>
