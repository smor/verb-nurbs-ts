name: ci
# One run per change: a pull request's commits run as the pull request (whatever branch it targets), and main, release
# tags and manual runs as themselves. (Running on every push as well ran each pull request's commits twice.)
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: typecheck, layers, lint, ratchets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run layers
      - run: npm run lint
      # no gate may be loosened relative to the branch a pull request targets (AGENTS.md, "Ratchets")
      - name: ratchets
        if: github.event_name == 'pull_request'
        run: npm run ratchets -- origin/${{ github.base_ref }}

  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    # pull requests test on Node 22; main, release tags and manual runs on every supported version. On a pull request
    # the Node 20 and 24 jobs still start, so the checks the branch rules require are reported, but skip every step
    # and finish in seconds.
    env:
      RUN: ${{ matrix.node == 22 || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - uses: actions/setup-node@v4
        if: env.RUN == 'true'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
        if: env.RUN == 'true'
      # coverage (five times slower than the plain run) on main, release tags and manual runs, on Node 22; a drop
      # shows on main right after the merge
      - name: test with coverage (fails below the thresholds)
        if: matrix.node == 22 && github.event_name != 'pull_request'
        run: npm run coverage
      - name: test
        if: env.RUN == 'true' && (matrix.node != 22 || github.event_name == 'pull_request')
        run: npm test
      - name: upload coverage report
        if: matrix.node == 22 && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  demos:
    name: demos, apps and API docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node examples/aalto-vessel.mjs out
      - run: node examples/swept-objects.mjs out
      - run: node examples/boolean-objects.mjs out
      - run: node examples/step-export.mjs out/step
      - run: npm run playground
      - run: npm run viewer
      - run: npm run docs
      - uses: actions/upload-artifact@v4
        with:
          name: api-docs
          path: docs/api/
