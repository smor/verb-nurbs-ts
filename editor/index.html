<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NURBS node editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: graph canvas on the left, 3D view + verdict + JSON on the right; stacked on phones. Drafting-table palette. */
:root{
  --bg:#eef0f2; --panel:#ffffff; --ink:#1b2430; --muted:#5d6876; --line:#cfd5dc;
  --accent:#1f6fb2; --solid:#8fa7bf; --num:#b26a1f;
  --ok:#2f7d4f; --ok-bg:#e3f2e8; --warn:#9a5b00; --warn-bg:#fbefd9; --cache:#5d6876; --cache-bg:#eceff2; --built-bg:#e2edf8;
  --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161b; --panel:#1a2028; --ink:#e3e8ee; --muted:#97a3b1; --line:#2c3540;
  --accent:#6fb0ea; --solid:#7f97b0; --num:#e0a060;
  --ok:#7fd3a0; --ok-bg:#16301f; --warn:#f0b860; --warn-bg:#352812; --cache:#97a3b1; --cache-bg:#222a33; --built-bg:#17293b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161b; --panel:#1a2028; --ink:#e3e8ee; --muted:#97a3b1; --line:#2c3540;
  --accent:#6fb0ea; --solid:#7f97b0; --num:#e0a060;
  --ok:#7fd3a0; --ok-bg:#16301f; --warn:#f0b860; --warn-bg:#352812; --cache:#97a3b1; --cache-bg:#222a33; --built-bg:#17293b; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
#app{height:100%}
.layout{height:100%;display:grid;grid-template-columns:190px minmax(0,1.6fr) minmax(320px,1fr);gap:0}
.palette{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line);padding-left:env(safe-area-inset-left,0px)}
.palette input[type=search]{margin:10px;padding:6px 8px;font:13px var(--sans);border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.palette-list{overflow:auto;padding:0 10px 12px;display:flex;flex-direction:column;gap:10px}
.palette h3{margin:4px 0 4px;font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.palette button{display:block;width:100%;text-align:left;font:13px var(--sans);color:var(--ink);background:none;border:0;border-radius:3px;padding:3px 6px;cursor:pointer}
.palette button:hover{background:var(--bg)}
.palette button:focus-visible,.toolbar button:focus-visible,.palette input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.canvas{position:relative}
.toolbar{position:absolute;z-index:5;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap}
.toolbar button,.toolbar select{font:500 12.5px var(--sans);color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:4px 10px;cursor:pointer}
.unit{font:11px var(--mono);color:var(--muted)}
.row select{font:12px var(--sans);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px}
.row .val.wide{width:150px}
.react-flow__minimap{background:var(--panel)}
.canvas{min-width:0;min-height:0;border-right:1px solid var(--line)}
.side{display:grid;grid-template-rows:minmax(240px,46%) auto minmax(0,1fr);min-width:0;min-height:0;background:var(--panel);
  padding-right:env(safe-area-inset-right,0px)}
.viewport{position:relative;min-height:0;border-bottom:1px solid var(--line)}
.viewport canvas{display:block}
.view3d{position:relative;min-height:0;display:grid}
.view3d .viewport{min-height:0}
.viewport .labels{position:absolute;inset:0;pointer-events:none}
.shelf-label{font:600 11.5px var(--sans);color:var(--ink);background:color-mix(in srgb,var(--panel) 82%,transparent);padding:1px 5px;border-radius:3px;white-space:nowrap}
.shelf-label.row{transform:translateX(-50%)}
.shelf-label small{display:block;font:400 10.5px var(--mono);color:var(--muted)}
.shelf-label.col{max-width:90px;white-space:normal;text-align:center}
.piece-card{position:fixed;z-index:20;pointer-events:none;max-width:320px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;
  box-shadow:0 6px 24px rgb(0 0 0 / .14);padding:8px 10px;font:12px/1.4 var(--sans)}
.piece-card b{font:600 12px var(--mono)}
.piece-card dl{margin:6px 0 0;display:grid;gap:2px}
.piece-card dl div{display:grid;grid-template-columns:92px 1fr;gap:6px}
.piece-card dt{color:var(--muted)}
.piece-card dd{margin:0}
.toolbar .note{align-self:center;font:12px var(--sans);color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:3px 8px}
.toolbar button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.layout.big{grid-template-columns:190px minmax(0,0.7fr) minmax(360px,2.2fr)}
.layout.big .side{grid-template-rows:minmax(300px,72%) auto minmax(0,1fr)}
.readout{padding:10px max(16px,env(safe-area-inset-left,0px)) 6px 16px;border-bottom:1px solid var(--line)}
.readout p{margin:6px 0 0}
.verdict-line{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.err{color:var(--warn);background:var(--warn-bg);padding:6px 8px;border-radius:4px;margin:0}
.json{display:flex;flex-direction:column;min-height:0;min-width:0}
.tabs{display:flex;gap:4px;padding:8px 16px 0}
.tabs button{font:500 12.5px var(--sans);color:var(--muted);background:none;border:0;border-bottom:2px solid transparent;padding:6px 8px;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.json pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;padding:10px 16px 16px;overflow:auto;font:12px/1.5 var(--mono);flex:1;min-height:0}
/* React Flow, in our tokens */
.react-flow{--xy-background-color:var(--bg);--xy-edge-stroke:var(--solid);--xy-controls-button-background-color:var(--panel);
  --xy-controls-button-color:var(--ink);--xy-controls-button-border-color:var(--line);--xy-background-pattern-dots-color:var(--line);--xy-attribution-background-color:transparent}
.react-flow__edge.e-number path{stroke:var(--num);stroke-width:2}
.react-flow__edge.e-solid path{stroke:var(--solid);stroke-width:3}
.react-flow__edge.selected path{stroke:var(--accent)}
.gn{background:var(--panel);border:1px solid var(--line);border-radius:6px;min-width:230px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.gn.shown{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.gn-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 0;cursor:grab}
.gn-title{font-weight:600}
.gn-type{padding:0 10px 6px;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line)}
.gn-type code{font-family:var(--mono)}
.row{position:relative;display:flex;align-items:center;gap:6px;padding:5px 10px;font-size:12.5px}
.row.out{justify-content:flex-end;border-top:1px solid var(--line)}
.lbl{min-width:72px;color:var(--muted)}
.row.out .lbl{min-width:0}
.row input[type=range]{width:86px;accent-color:var(--num)}
.row .val{width:64px;font:12px var(--mono);padding:2px 4px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink)}
.row .val:focus-visible,.show:focus-visible,.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.expr-tag{font:11px var(--mono);color:var(--num);width:86px}
.wired{font:12px var(--mono);color:var(--muted)}
.show{margin-right:auto;font:500 11.5px var(--sans);border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:3px;padding:2px 8px;cursor:pointer}
.out-toggle{margin-right:6px}
.show[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.react-flow__handle{width:10px;height:10px;border:2px solid var(--panel)}
.react-flow__handle.h-number{background:var(--num)} .react-flow__handle.h-solid{background:var(--solid)}
.pill{font:500 11px var(--mono);padding:1px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.pill.built{background:var(--built-bg);color:var(--accent)} .pill.cached{background:var(--cache-bg);color:var(--cache)}
.pill.idle{background:var(--cache-bg);color:var(--muted)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.big{font-size:12px;padding:2px 9px}
@media (max-width:760px){
  .layout{grid-template-columns:1fr;grid-template-rows:160px 56vh auto}
  .palette{border-right:0;border-bottom:1px solid var(--line)}
  .canvas{border-right:0;border-bottom:1px solid var(--line);padding-left:env(safe-area-inset-left,0px)}
  .side{grid-template-rows:300px auto 320px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* parameter controls (editor/controls): compact in nodes, full in the Customize panel */
.nf{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.nf.full{flex-direction:column;align-items:stretch;gap:4px;max-width:760px;--nf-label:clamp(120px,30%,220px)}
.nf-line{display:flex;align-items:center;gap:6px;min-width:0}
.nf.full .nf-line{display:grid;grid-template-columns:var(--nf-label) 24px minmax(80px,1fr) 24px auto minmax(24px,auto) 24px 24px;align-items:center}
.nf-label{min-width:72px;color:var(--muted);user-select:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nf.full .nf-label{color:var(--ink);white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.25}
.nf-label.scrub{cursor:ew-resize;touch-action:none}
.nf-label.scrub:hover{color:var(--ink);text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.nf-value{position:relative;display:inline-flex;align-items:center;gap:4px;min-width:0}
.nf-value input{width:64px;font:12px var(--mono);font-variant-numeric:tabular-nums;padding:2px 4px;border:1px solid var(--line);border-radius:3px;
  background:var(--bg);color:var(--ink)}
.nf.compact .nf-value input{background:linear-gradient(90deg,color-mix(in srgb,var(--num) 22%,transparent) calc(var(--nf-frac,0)*100%),var(--bg) 0)}
.nf.full .nf-value input{width:72px}
.nf-value input:focus-visible,.nf-step:focus-visible,.nf-menu:focus-visible,.nf-switch:focus-visible,.nf-segments button:focus-visible,
.nf-presets button:focus-visible,.nf-slider input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nf-value.holding input{border-style:dashed;color:var(--muted)}
.nf-value.out input{border-color:var(--warn);box-shadow:0 0 0 1px var(--warn) inset}
.nf-fx{font:11px var(--mono);color:var(--num)}
.nf-computed{font:11px var(--mono);color:var(--muted);white-space:nowrap}
.nf-unit{font:11px var(--mono);color:var(--muted)}
.nf-step{flex:0 0 24px;height:24px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);font:15px/1 var(--sans);cursor:pointer;
  touch-action:none;user-select:none}
.nf-step:hover{border-color:var(--muted)}
.nf-step:active{background:var(--bg)}
.nf-slider{position:relative;flex:1;min-width:60px;display:flex;align-items:center}
.nf-slider input{width:100%;accent-color:color-mix(in srgb,var(--num) 75%,var(--panel));margin:0}
.nf-tick{position:absolute;bottom:-3px;width:2px;height:6px;margin-left:-1px;background:var(--muted);border-radius:1px;pointer-events:none}
.nf-menu{flex:0 0 24px;height:24px;border:0;background:none;color:var(--muted);font:16px/1 var(--sans);cursor:pointer;border-radius:4px}
.nf-menu:hover,.nf-locate:hover{background:var(--bg);color:var(--ink)}
.nf-locate{flex:0 0 24px;height:24px;border:0;background:none;color:var(--muted);font:14px/1 var(--sans);cursor:pointer;border-radius:4px}
.nf-locate:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nf-presets{display:flex;gap:4px;flex-wrap:wrap;padding-left:calc(var(--nf-label,36%) + 6px)}
.nf-presets button{font:11.5px var(--sans);padding:2px 9px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);cursor:pointer}
.nf-presets button[aria-pressed="true"]{background:var(--num);border-color:var(--num);color:#fff}
.nf-switch{position:relative;width:34px;height:20px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;padding:0}
.nf-switch span{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--muted);transition:left .12s}
.nf-switch[aria-checked="true"]{background:var(--num);border-color:var(--num)}
.nf-switch[aria-checked="true"] span{left:16px;background:#fff}
.nf-segments{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.nf-segments button{font:12px var(--sans);padding:3px 9px;border:0;border-right:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.nf-segments button:last-child{border-right:0}
.nf-segments button[aria-checked="true"]{background:var(--num);color:#fff}
.nf.choice select{font:12px var(--sans);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px}
@media (prefers-reduced-motion: reduce){.nf-switch span{transition:none}}

/* the Customize panel */
.param-panel{overflow:auto;padding:4px 16px 16px;min-height:0;flex:1}
.param-panel section{border-bottom:1px solid var(--line);padding:4px 0 8px}
.param-panel h3{margin:6px 0 4px}
.param-panel h3 button{all:unset;cursor:pointer;font:600 12px var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.param-panel h3 button::before{content:"▾";font-size:10px;transition:transform .12s}
.param-panel h3 button[aria-expanded="false"]::before{transform:rotate(-90deg)}
.param-panel h3 button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pp-count{font:11px var(--mono);color:var(--muted);letter-spacing:0}
.pp-row{padding:4px 0;border-radius:4px}
.pp-row:hover{background:color-mix(in srgb,var(--num) 7%,transparent)}
.pp-empty{padding:12px 16px}
.react-flow__node.lit{outline:2px solid var(--num);outline-offset:3px;border-radius:6px}
.hold-hint{margin:0 0 6px;font:12px var(--sans);color:var(--muted);border-left:3px dashed var(--num);padding-left:8px}
.back-good{margin:0 0 6px}
.back-good button{font:500 12.5px var(--sans);color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn);border-radius:4px;padding:4px 10px;cursor:pointer}

.side.customizing{grid-template-rows:minmax(220px,44%) auto minmax(0,1fr)}
.layout.big .side.customizing{grid-template-rows:minmax(260px,50%) auto minmax(0,1fr)}
/* the settings popover */
.param-menu{position:fixed;z-index:30;width:280px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 32px rgb(0 0 0 / .18);
  padding:12px;display:grid;gap:8px;font:12px var(--sans)}
.param-menu label{display:grid;gap:3px;color:var(--muted)}
.param-menu input,.param-menu select{font:12px var(--mono);padding:3px 5px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);min-width:0}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pm-row{display:flex;gap:6px}
.pm-row input{flex:1}
.pm-row button,.pm-actions button{font:12px var(--sans);padding:3px 10px;border:1px solid var(--line);border-radius:4px;background:var(--panel);color:var(--ink);cursor:pointer}
.pm-actions{display:flex;justify-content:flex-end;gap:6px}
.pm-actions button[type="submit"]{background:var(--accent);border-color:var(--accent);color:#fff}
.pm-actions button:disabled{opacity:.5;cursor:default}
.pm-problem{margin:0;color:var(--warn)}
</style>
</head>
<body>
<div id="app"></div>
<!--BUNDLE-->
</body>
</html>
